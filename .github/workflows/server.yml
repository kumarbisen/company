name: Deploy Server to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          missing=()
          [ -n "${{ secrets.EC2_HOST }}" ] || missing+=("EC2_HOST")
          [ -n "${{ secrets.EC2_USERNAME }}" ] || missing+=("EC2_USERNAME")
          [ -n "${{ secrets.EC2_PRIVATE_KEY }}" ] || missing+=("EC2_PRIVATE_KEY")
          [ -n "${{ secrets.SERVER_ENV }}" ] || missing+=("SERVER_ENV")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          KEY_FILE="$RUNNER_TEMP/ec2_key"
          umask 177
          RAW_KEY="${{ secrets.EC2_PRIVATE_KEY }}"
          printf '%s' "$RAW_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$KEY_FILE"
          if ! grep -q "BEGIN .*PRIVATE KEY" "$KEY_FILE"; then
            if printf '%s' "$RAW_KEY" | tr -d '\r\n' | base64 --decode 2>/dev/null | tr -d '\r' > "$KEY_FILE" && grep -q "BEGIN .*PRIVATE KEY" "$KEY_FILE"; then
              :
            else
              echo "::error::EC2_PRIVATE_KEY appears invalid. Use a PEM/OpenSSH private key (plain or base64-encoded)."
              exit 1
            fi
          fi
          echo "EC2_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Copy Server folder to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: ${{ env.EC2_KEY_PATH }}
          source: "server/"
          target: "/home/ubuntu"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: ${{ env.EC2_KEY_PATH }}
          script: |
            # Load nvm/node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Navigate to server workspace
            cd /home/ubuntu/server
            
            # Write server .env securely from secret
            echo "${{ secrets.SERVER_ENV }}" > .env
            
            npm install
            npm run build
            pm2 delete kunalconnects-server 2>/dev/null || true
            pm2 start dist/src/index.js --name "kunalconnects-server"
            pm2 save
