name: Deploy Server to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          missing=()
          [ -n "${{ secrets.EC2_HOST }}" ] || missing+=("EC2_HOST")
          [ -n "${{ secrets.EC2_USERNAME }}" ] || missing+=("EC2_USERNAME")
          [ -n "${{ secrets.EC2_PRIVATE_KEY }}" ] || missing+=("EC2_PRIVATE_KEY")
          [ -n "${{ secrets.SERVER_ENV }}" ] || missing+=("SERVER_ENV")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi


      - name: Prepare SSH key
        run: |
          KEY_FILE="$RUNNER_TEMP/ec2_key"
          RAW_KEY="${{ secrets.EC2_PRIVATE_KEY }}"
          printf '%s\n' "$RAW_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$KEY_FILE"
          
          # If the user omitted the header/footer when pasting, wrap it!
          if ! grep -q "BEGIN .*PRIVATE KEY" "$KEY_FILE"; then
            echo "-----BEGIN RSA PRIVATE KEY-----" > "$KEY_FILE.tmp"
            cat "$KEY_FILE" >> "$KEY_FILE.tmp"
            echo "-----END RSA PRIVATE KEY-----" >> "$KEY_FILE.tmp"
            mv "$KEY_FILE.tmp" "$KEY_FILE"
          fi
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "EC2_KEY_ENV<<$EOF" >> "$GITHUB_ENV"
          cat "$KEY_FILE" >> "$GITHUB_ENV"
          echo "$EOF" >> "$GITHUB_ENV"

      - name: Copy Server folder to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_KEY_ENV }}
          source: "server/"
          target: "/home/ubuntu"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_KEY_ENV }}
          script: |
            # Load nvm/node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Navigate to server workspace
            cd /home/ubuntu/server
            
            # Write server .env securely from secret
            cat << 'EOF' > .env
            ${{ secrets.SERVER_ENV }}
            EOF
            
            npm install
            npm run build
            pm2 delete kunalconnects-server 2>/dev/null || true
            pm2 start dist/src/index.js --name "kunalconnects-server"
            pm2 save
